{% extends 'base.html' %}

{% block title %}Login - Smart GP Portal{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h3 class="text-center fw-bold mb-4 text-success">Login</h3>
                    <form method="POST" action="{{ url_for('auth.login') }}">
                        <div class="mb-3">
                            <label for="mobile" class="form-label">Mobile Number</label>
                            <input type="text" class="form-control" id="mobile" name="mobile" placeholder="Enter mobile number" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100 fw-semibold">Login</button>
                    </form>
                    <hr>
                    <p class="text-center mb-1">
                        Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-success fw-semibold">Register here</a>
                    </p>
                    <p class="text-center text-muted small">
                        Admin? Use your admin credentials to login with the same form.
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
