{% extends 'base.html' %}

{% block title %}{% if officer %}Edit Officer{% else %}Add Officer{% endif %} - Admin{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold mb-0">{% if officer %}Edit Officer Details{% else %}Add New Officer{% endif %}</h3>
                <a href="{{ url_for('admin.manage_officers') }}" class="btn btn-outline-secondary btn-sm">&larr; Back</a>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Officer Name</label>
                            <input type="text" name="name" class="form-control" required value="{{ officer.name if officer else '' }}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Mobile Number</label>
                            <input type="tel" name="mobile" class="form-control" required value="{{ officer.mobile if officer else '' }}">
                            <small class="text-muted">Used for officer login</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Department</label>
                            <select name="department" class="form-select" required>
                                <option value="">Select Department...</option>
                                {% for dept in ['Public Works', 'Water Department', 'Sanitation Department', 'Electrical Department', 'Health & Sanitation', 'General Administration'] %}
                                    <option value="{{ dept }}" {% if officer and officer.department == dept %}selected{% endif %}>{{ dept }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">
                                Password {% if officer %}<small class="text-muted fw-normal">(Leave blank to keep unchanged)</small>{% endif %}
                            </label>
                            <input type="password" name="password" class="form-control" {% if not officer %}required{% endif %}>
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2">
                            {% if officer %}Save Changes{% else %}Create Officer Account{% endif %}
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
